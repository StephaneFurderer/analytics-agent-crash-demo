[project]
name = "compass-demo"
version = "0.1.0"
description = "Compass Assistance analytics agent demo: seeded warehouse, Metric layer and Legacy dashboard"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "nao-core[anthropic,duckdb]>=0.4.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.scripts]
demo = "compass.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
