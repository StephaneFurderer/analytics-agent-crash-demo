# The Analytics agent's nao project. Run it with `uv run demo chat`.
#
# Chapter 2: the agent sees the raw schema through nao's automatic sync only.
# The warehouse file holds the base tables only: the Metric layer is applied per
# connection by the dashboard and the benchmark (ADR 0005) until it becomes part
# of the Context layer in Chapter 6. The metric_* exclude is a second guard.
#
# The API key is read from the environment and never written here.
# Do NOT run `nao init` in this folder: it rewrites this file with the key inlined.
project_name: compass-analytics-agent
databases:
  - type: duckdb
    name: warehouse
    path: ../warehouse/compass.duckdb
    templates: [columns, preview]
    exclude: ["*.metric_*"]
llm:
  providers:
    - provider: anthropic
      api_key: "{{ env('ANTHROPIC_API_KEY') }}"
      models:
        - id: claude-opus-5-5
          default: true
# The benchmark (`uv run demo benchmark`): each Benchmark question in tests/ is asked k times;
# `demo report` counts it correct only if all k runs pass.
test:
  models: [anthropic:claude-opus-5-5]
  k: 3
  threads: 1
